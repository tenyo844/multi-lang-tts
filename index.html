<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多言語翻訳・読み上げアプリ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 720px;
      padding: 20px;
      align-self: flex-start;
    }
    @media (min-width: 600px) {
      .card { padding: 32px; align-self: center; }
    }
    h1 { font-size: 20px; color: #1a202c; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: #718096; margin-bottom: 18px; }

    .lang-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f7fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 16px;
    }
    .lang-select {
      flex: 1;
      min-width: 100px;
      font-size: 15px;
      padding: 8px 6px;
      border: 1.5px solid #c3dafe;
      border-radius: 8px;
      font-family: inherit;
      color: #2d3748;
      background: white;
      font-weight: 600;
    }
    .lang-arrow { font-size: 20px; color: #a0aec0; flex-shrink: 0; }
    .swap-btn {
      background: #edf2ff;
      color: #667eea;
      border: 2px solid #c3dafe;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      flex-shrink: 0;
    }
    .swap-btn:active { background: #c3dafe; }

    .section { margin-bottom: 16px; }
    .field-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #718096;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    textarea {
      width: 100%;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 16px;
      line-height: 1.6;
      resize: vertical;
      min-height: 100px;
      font-family: inherit;
    }
    textarea:focus { outline: none; border-color: #667eea; }
    .result-box {
      background: #f7fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      line-height: 1.6;
      min-height: 72px;
      color: #2d3748;
    }
    .result-box.empty { color: #a0aec0; font-style: italic; }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .slider-row .field-label { margin: 0; min-width: 90px; white-space: nowrap; }
    .slider-row input[type="range"] { flex: 1; height: 22px; accent-color: #667eea; }
    .slider-row select {
      flex: 1; min-width: 0; font-size: 16px; padding: 7px 10px;
      border: 1.5px solid #e2e8f0; border-radius: 8px;
      font-family: inherit; color: #2d3748; background: white;
    }
    .val-disp { font-size: 13px; color: #718096; min-width: 36px; text-align: right; }

    hr.divider { border: none; border-top: 1.5px solid #e2e8f0; margin: 18px 0 12px; }
    .btn-label {
      font-size: 11px; font-weight: 700; color: #a0aec0;
      text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px;
    }
    .controls { display: grid; gap: 8px; grid-template-columns: 1fr 1fr; }
    @media (min-width: 520px) { .controls { grid-template-columns: 2fr 1fr 1fr 1fr 1fr; } }

    .btn {
      padding: 14px 8px; border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700; cursor: pointer;
      font-family: inherit; touch-action: manipulation;
      -webkit-tap-highlight-color: rgba(0,0,0,0.1);
    }
    .btn:active { filter: brightness(0.9); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-translate { background: #667eea; color: white; grid-column: 1 / -1; }
    @media (min-width: 520px) { .btn-translate { grid-column: auto; } }
    .btn-play  { background: #48bb78; color: white; }
    .btn-pause { background: #ed8936; color: white; }
    .btn-stop  { background: #fc8181; color: white; }
    .btn-save  { background: #805ad5; color: white; }

    .status {
      margin-top: 12px; font-size: 13px; color: #718096;
      min-height: 18px; word-break: break-all;
    }
    .status.err  { color: #e53e3e; }
    .status.ok   { color: #38a169; }
    .status.warn { color: #ed8936; }
    .status.load { color: #667eea; }
  </style>
</head>
<body>
<div class="card">
  <h1>🌐 多言語翻訳・読み上げ</h1>
  <p class="subtitle">テキストを翻訳して音声で読み上げます</p>

  <div class="lang-bar">
    <select class="lang-select" id="srcLang">
      <option value="ja">日本語</option>
      <option value="en" selected>英語</option>
      <option value="zh-CN">中国語（簡体）</option>
      <option value="zh-TW">中国語（繁体）</option>
      <option value="ko">韓国語</option>
      <option value="fr">フランス語</option>
      <option value="de">ドイツ語</option>
      <option value="es">スペイン語</option>
      <option value="it">イタリア語</option>
      <option value="pt">ポルトガル語</option>
      <option value="ru">ロシア語</option>
      <option value="ar">アラビア語</option>
      <option value="hi">ヒンディー語</option>
      <option value="th">タイ語</option>
      <option value="vi">ベトナム語</option>
      <option value="id">インドネシア語</option>
      <option value="nl">オランダ語</option>
      <option value="sv">スウェーデン語</option>
      <option value="tr">トルコ語</option>
      <option value="pl">ポーランド語</option>
    </select>
    <span class="lang-arrow">→</span>
    <select class="lang-select" id="tgtLang">
      <option value="ja" selected>日本語</option>
      <option value="en">英語</option>
      <option value="zh-CN">中国語（簡体）</option>
      <option value="zh-TW">中国語（繁体）</option>
      <option value="ko">韓国語</option>
      <option value="fr">フランス語</option>
      <option value="de">ドイツ語</option>
      <option value="es">スペイン語</option>
      <option value="it">イタリア語</option>
      <option value="pt">ポルトガル語</option>
      <option value="ru">ロシア語</option>
      <option value="ar">アラビア語</option>
      <option value="hi">ヒンディー語</option>
      <option value="th">タイ語</option>
      <option value="vi">ベトナム語</option>
      <option value="id">インドネシア語</option>
      <option value="nl">オランダ語</option>
      <option value="sv">スウェーデン語</option>
      <option value="tr">トルコ語</option>
      <option value="pl">ポーランド語</option>
    </select>
    <button class="swap-btn" id="swapBtn">⇄</button>
  </div>

  <div class="section">
    <label class="field-label" id="inputLabel">入力テキスト（英語）</label>
    <textarea id="inputText" placeholder="Enter English text here..."></textarea>
  </div>
  <div class="section">
    <label class="field-label" id="outputLabel">翻訳結果（日本語）</label>
    <div id="translatedText" class="result-box empty">翻訳結果がここに表示されます</div>
  </div>

  <div class="slider-row">
    <label class="field-label">声の種類</label>
    <select id="voiceSelect"><option value="-1">（自動選択）</option></select>
  </div>
  <div class="slider-row">
    <label class="field-label">音量</label>
    <input type="range" id="volume" min="0" max="1" step="0.05" value="1">
    <span class="val-disp" id="volumeVal">1.0</span>
  </div>
  <div class="slider-row">
    <label class="field-label">読み上げ速度</label>
    <input type="range" id="speed" min="0.5" max="2" step="0.05" value="0.9">
    <span class="val-disp" id="speedVal">0.9</span>
  </div>
  <div class="slider-row">
    <label class="field-label">ピッチ</label>
    <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1.1">
    <span class="val-disp" id="pitchVal">1.1</span>
  </div>

  <hr class="divider">
  <div class="btn-label">操作ボタン</div>
  <div class="controls">
    <button class="btn btn-translate" id="translateBtn">翻訳する</button>
    <button class="btn btn-play"  id="speakBtn"  disabled>▶ 再生</button>
    <button class="btn btn-pause" id="pauseBtn"  disabled>⏸ 一時停止</button>
    <button class="btn btn-stop"  id="stopBtn"   disabled>■ 停止</button>
    <button class="btn btn-save"  id="saveBtn"   disabled>💾 保存</button>
  </div>
  <div class="status" id="status"></div>
</div>

<script>
var srcLangSel   = document.getElementById('srcLang');
var tgtLangSel   = document.getElementById('tgtLang');
var swapBtn      = document.getElementById('swapBtn');
var inputText    = document.getElementById('inputText');
var translatedEl = document.getElementById('translatedText');
var inputLabel   = document.getElementById('inputLabel');
var outputLabel  = document.getElementById('outputLabel');
var voiceSelect  = document.getElementById('voiceSelect');
var volumeSlider = document.getElementById('volume');
var speedSlider  = document.getElementById('speed');
var pitchSlider  = document.getElementById('pitch');
var volumeVal    = document.getElementById('volumeVal');
var speedVal     = document.getElementById('speedVal');
var pitchVal     = document.getElementById('pitchVal');
var translateBtn = document.getElementById('translateBtn');
var speakBtn     = document.getElementById('speakBtn');
var pauseBtn     = document.getElementById('pauseBtn');
var stopBtn      = document.getElementById('stopBtn');
var saveBtn      = document.getElementById('saveBtn');
var statusEl     = document.getElementById('status');

// 言語コード → 音声言語コードのマッピング
var VOICE_MAP = {
  'ja': 'ja-JP', 'en': 'en-US', 'zh-CN': 'zh-CN', 'zh-TW': 'zh-TW',
  'ko': 'ko-KR', 'fr': 'fr-FR', 'de': 'de-DE', 'es': 'es-ES',
  'it': 'it-IT', 'pt': 'pt-BR', 'ru': 'ru-RU', 'ar': 'ar-SA',
  'hi': 'hi-IN', 'th': 'th-TH', 'vi': 'vi-VN', 'id': 'id-ID',
  'nl': 'nl-NL', 'sv': 'sv-SE', 'tr': 'tr-TR', 'pl': 'pl-PL'
};

var translated = '';
var playState  = 'idle';

function getSrcCode() { return srcLangSel.value; }
function getTgtCode() { return tgtLangSel.value; }
function getTgtName() { return tgtLangSel.options[tgtLangSel.selectedIndex].text; }
function getSrcName() { return srcLangSel.options[srcLangSel.selectedIndex].text; }
function getTgtVoiceLang() { return VOICE_MAP[getTgtCode()] || getTgtCode(); }

function updateLabels() {
  inputLabel.textContent  = '入力テキスト（' + getSrcName() + '）';
  outputLabel.textContent = '翻訳結果（'     + getTgtName() + '）';
  populateVoices();
}

function reset() {
  inputText.value = '';
  translatedEl.textContent = '翻訳結果がここに表示されます';
  translatedEl.classList.add('empty');
  translated = '';
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(e) {}
  playState = 'idle';
  refreshButtons();
  setStatus('');
}

srcLangSel.addEventListener('change', function() { reset(); updateLabels(); });
tgtLangSel.addEventListener('change', function() { reset(); updateLabels(); });

function doSwap() {
  var tmp = srcLangSel.value;
  srcLangSel.value = tgtLangSel.value;
  tgtLangSel.value = tmp;
  reset();
  updateLabels();
}
swapBtn.addEventListener('click', doSwap);
swapBtn.addEventListener('touchend', function(e) { e.preventDefault(); doSwap(); });

// 声一覧
function populateVoices() {
  try {
    if (!window.speechSynthesis) {
      voiceSelect.innerHTML = '<option value="">（非対応）</option>';
      return;
    }
    var voices = speechSynthesis.getVoices();
    // まだ読み込まれていない場合は何もしない（リトライを待つ）
    if (voices.length === 0) return;

    var voiceLang = getTgtVoiceLang();
    var prefix    = voiceLang.split('-')[0];
    var list      = [];
    for (var i = 0; i < voices.length; i++) {
      if (voices[i].lang === voiceLang || voices[i].lang.indexOf(prefix) === 0) {
        list.push(voices[i]);
      }
    }
    voiceSelect.innerHTML = '';
    if (list.length === 0) {
      voiceSelect.innerHTML = '<option value="-1">（自動選択）</option>';
      return;
    }
    for (var j = 0; j < list.length; j++) {
      var opt = document.createElement('option');
      opt.value = j;
      opt.textContent = list[j].name + (list[j].localService ? '' : ' (online)');
      voiceSelect.appendChild(opt);
    }
    // Compact でない高品質音声を優先
    for (var k = 0; k < list.length; k++) {
      if (list[k].name.toLowerCase().indexOf('compact') === -1) {
        voiceSelect.value = k;
        break;
      }
    }
  } catch(e) {
    voiceSelect.innerHTML = '<option value="">（エラー）</option>';
  }
}

function getVoice() {
  try {
    var idx = parseInt(voiceSelect.value, 10);
    if (isNaN(idx) || idx < 0) return null; // 自動選択 → lang属性に任せる
    var voiceLang = getTgtVoiceLang();
    var prefix    = voiceLang.split('-')[0];
    var voices    = speechSynthesis.getVoices();
    var list      = [];
    for (var i = 0; i < voices.length; i++) {
      if (voices[i].lang === voiceLang || voices[i].lang.indexOf(prefix) === 0) {
        list.push(voices[i]);
      }
    }
    return list[idx] || null;
  } catch(e) { return null; }
}

if (window.speechSynthesis) {
  speechSynthesis.onvoiceschanged = populateVoices;
  populateVoices();
  setTimeout(populateVoices, 300);
  setTimeout(populateVoices, 1000);
  // iOS Safariでは voices が永遠に空のため、3秒後に諦めて「自動選択」にする
  setTimeout(function() {
    var opts = voiceSelect.options;
    if (opts.length === 1 && opts[0].value === '') {
      voiceSelect.innerHTML = '<option value="-1">（自動選択）</option>';
    }
  }, 3000);
}

// スライダー
volumeSlider.addEventListener('input', function() { volumeVal.textContent = parseFloat(volumeSlider.value).toFixed(1); });
speedSlider.addEventListener('input',  function() { speedVal.textContent  = parseFloat(speedSlider.value).toFixed(2).replace(/0$/, ''); });
pitchSlider.addEventListener('input',  function() { pitchVal.textContent  = parseFloat(pitchSlider.value).toFixed(1); });

function refreshButtons() {
  speakBtn.disabled = (playState !== 'idle') || !translated;
  stopBtn.disabled  = (playState === 'idle');
  saveBtn.disabled  = !translated;
  if (playState === 'paused') {
    pauseBtn.textContent = '▶ 再開';
    pauseBtn.disabled    = false;
  } else {
    pauseBtn.textContent = '⏸ 一時停止';
    pauseBtn.disabled    = (playState !== 'speaking');
  }
}

function stripTimestamps(text) {
  return text
    .replace(/\[?\(?\d{1,2}:\d{2}(:\d{2})?\]?\)?/g, '')
    .replace(/^\s*[\r\n]/gm, '')
    .replace(/\n{2,}/g, '\n')
    .trim();
}

// 翻訳
function doTranslate() {
  var raw = inputText.value.trim();
  if (!raw) { setStatus('テキストを入力してください', 'err'); return; }
  if (getSrcCode() === getTgtCode()) { setStatus('翻訳元と翻訳先に同じ言語は選べません', 'err'); return; }
  var text = stripTimestamps(raw);
  translateBtn.disabled = true;
  translated = '';
  refreshButtons();
  setStatus('翻訳中...', 'load');

  var url = 'https://translate.googleapis.com/translate_a/single'
    + '?client=gtx&sl=' + encodeURIComponent(getSrcCode())
    + '&tl=' + encodeURIComponent(getTgtCode())
    + '&dt=t&q=' + encodeURIComponent(text);

  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.timeout = 10000;
  xhr.onreadystatechange = function() {
    if (xhr.readyState !== 4) return;
    translateBtn.disabled = false;
    if (xhr.status === 200) {
      try {
        var data = JSON.parse(xhr.responseText);
        var out = '';
        for (var i = 0; i < data[0].length; i++) {
          if (data[0][i] && data[0][i][0]) out += data[0][i][0];
        }
        if (!out) { setStatus('翻訳結果が空でした', 'err'); refreshButtons(); return; }
        translated = out;
        translatedEl.textContent = out;
        translatedEl.classList.remove('empty');
        setStatus('翻訳完了 ✓', 'ok');
      } catch(e) {
        setStatus('解析エラー: ' + e.message, 'err');
      }
    } else {
      setStatus('翻訳失敗 (HTTP ' + xhr.status + ') ※Wi-Fi接続を確認してください', 'err');
    }
    refreshButtons();
  };
  xhr.ontimeout = function() {
    translateBtn.disabled = false;
    setStatus('タイムアウト ※インターネット接続を確認してください', 'err');
    refreshButtons();
  };
  xhr.onerror = function() {
    translateBtn.disabled = false;
    setStatus('接続エラー ※インターネットに接続してください', 'err');
    refreshButtons();
  };
  xhr.send();
}
translateBtn.addEventListener('click', doTranslate);
translateBtn.addEventListener('touchend', function(e) { e.preventDefault(); doTranslate(); });

// iOS Safari: 最初のタップで音声を解放する
var audioUnlocked = false;
function unlockAudio() {
  if (audioUnlocked || !window.speechSynthesis) return;
  try {
    var dummy = new SpeechSynthesisUtterance('');
    dummy.volume = 0;
    speechSynthesis.speak(dummy);
    speechSynthesis.cancel();
    audioUnlocked = true;
  } catch(e) {}
}
document.addEventListener('touchstart', unlockAudio, { once: true });
document.addEventListener('click', unlockAudio, { once: true });

// 再生
function doSpeak() {
  if (!translated || !window.speechSynthesis) return;
  unlockAudio();
  try { speechSynthesis.cancel(); } catch(e) {}

  playState = 'speaking';
  refreshButtons();
  setStatus('読み上げ中...', 'ok');

  var utt  = new SpeechSynthesisUtterance(translated);
  utt.lang   = getTgtVoiceLang();
  utt.rate   = parseFloat(speedSlider.value);
  utt.pitch  = parseFloat(pitchSlider.value);
  utt.volume = parseFloat(volumeSlider.value);
  var voice  = getVoice();
  if (voice) utt.voice = voice;

  utt.onend = function() {
    playState = 'idle'; refreshButtons(); setStatus('読み上げ完了 ✓');
  };
  utt.onerror = function(ev) {
    // iOS では 'interrupted' は正常停止なので無視
    if (ev.error === 'interrupted' || ev.error === 'canceled') {
      playState = 'idle'; refreshButtons(); setStatus('');
    } else {
      playState = 'idle'; refreshButtons(); setStatus('読み上げエラー: ' + ev.error, 'err');
    }
  };
  try {
    speechSynthesis.speak(utt);
  } catch(e) {
    playState = 'idle'; refreshButtons(); setStatus('読み上げに失敗しました', 'err');
  }
}
speakBtn.addEventListener('click', doSpeak);
speakBtn.addEventListener('touchend', function(e) { e.preventDefault(); doSpeak(); });

pauseBtn.addEventListener('click', function() {
  if (playState === 'speaking') {
    speechSynthesis.pause(); playState = 'paused'; setStatus('一時停止中', 'warn');
  } else if (playState === 'paused') {
    speechSynthesis.resume(); playState = 'speaking'; setStatus('読み上げ中...', 'ok');
  }
  refreshButtons();
});

stopBtn.addEventListener('click', function() {
  try { speechSynthesis.cancel(); } catch(e) {}
  playState = 'idle'; refreshButtons(); setStatus('');
});

// 保存
saveBtn.addEventListener('click', function() {
  if (!translated) return;
  var bom  = '﻿';
  var blob = new Blob([bom + translated], { type: 'text/plain;charset=utf-8' });
  var name = (window.prompt('ファイル名を入力してください', '翻訳結果') || '翻訳結果').replace(/\.txt$/, '') + '.txt';
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
  setStatus('保存しました: ' + name, 'ok');
});

inputText.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); translateBtn.click(); }
});

function setStatus(msg, cls) {
  statusEl.textContent = msg || '';
  statusEl.className   = 'status' + (cls ? ' ' + cls : '');
}

refreshButtons();
updateLabels();
setStatus('アプリ起動完了 ✓', 'ok');
setTimeout(function() { setStatus(''); }, 2000);
</script>
</body>
</html>
